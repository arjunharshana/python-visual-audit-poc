version: "3.8"

services:
  selenium-hub:
    image: selenium/hub:latest
    container_name: python-selenium-hub
    ports:
      - "4444:4444"

  firefox-node:
    image: selenium/node-firefox:latest
    container_name: python-firefox-node
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443